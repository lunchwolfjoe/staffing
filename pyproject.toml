[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "staffing-optimizer"
version = "1.0.0"
description = "A comprehensive tool for optimizing workforce staffing patterns"
readme = "README.md"
requires-python = ">=3.8,<3.11"
license = {text = "MIT License"}
dependencies = [
    "streamlit==1.30.0",
    "pandas==2.0.3",
    "numpy==1.24.3",
    "plotly==5.18.0",
    "pulp==2.7.0",
    "matplotlib==3.7.3",
    "typing-extensions==4.9.0",
    "scipy==1.10.1",
    "python-dateutil==2.8.2",
    "pytz==2023.3",
    "protobuf==4.25.2",
    "pillow==10.2.0",
    "altair==5.1.2",
    "watchdog==3.0.0"
]

[project.urls]
"Homepage" = "https://github.com/lunchwolfjoe/staffing"
"Bug Tracker" = "https://github.com/lunchwolfjoe/staffing/issues" 